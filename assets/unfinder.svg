  <rect x="13.5" y="13.5" width="360" height="365" rx="14" fill="#1a1a1a"/>
  <!-- face: white right half with the nose profile, thin black outline -->
  <path d="M196.9 23.5 L358.5 23.5 L358.5 367.5 L197.3 367.5 L201.8 198 L151.2 195 Z"
        fill="#f9f9f9" stroke="#000" stroke-width="3" stroke-linejoin="miter"/>
