  <rect x="92" y="68" width="31.5" height="86.5" rx="8" fill="#5a8bc3"/>
  <rect x="256" y="73" width="31.5" height="86.5" rx="8" fill="#5a8bc3"/>
  <!-- smile: arc of a circle centred at (184.8, 165.7), radius 155.5 -->
